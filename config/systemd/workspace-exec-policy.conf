# config/systemd/workspace-exec-policy.conf
#
# Drop-in for the agent session unit. Two jobs (REQ-EXEC-103, REQ-EXEC-116,
# REQ-EXEC-123):
#
#   1. The fail-closed gate. The session starts only when the posture is
#      armed and the readiness manifest lists every layer owner as active.
#      If any owner is missing the session refuses; no layer substitutes
#      for another.
#
#   2. The capability lane. The capability LSM plus this bounding set own
#      which capabilities the session may hold; the reviewed four-cap set
#      matches REQ-GGUARD-001, and NoNewPrivileges stays off so the
#      file-capped host-exec path can raise them at exec time.
#
# Installed to:
#   /etc/systemd/system/workspace-agent@.service.d/10-exec-policy.conf
# by: sudo make install-exec-policy

[Service]
ExecCondition=/usr/local/bin/workspace-exec-policy-session-gate
CapabilityBoundingSet=CAP_SETPCAP CAP_CHOWN CAP_DAC_OVERRIDE CAP_FOWNER
AmbientCapabilities=
NoNewPrivileges=no
