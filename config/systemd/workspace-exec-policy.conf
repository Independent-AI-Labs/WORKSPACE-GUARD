# config/systemd/workspace-exec-policy.conf
#
# Drop-in for the agent session unit. Adds the conditional fail-closed
# gate: ordinary sessions start while the posture is staged, but a
# session refuses to start when the posture is enforcing and the loader
# readiness token is absent (REQ-EXEC-103, REQ-EXEC-116).
#
# Installed to:
#   /etc/systemd/system/workspace-agent@.service.d/10-exec-policy.conf
# by: sudo make install-exec-policy
#
# The gate only bites in enforce mode, so a host that has staged the
# interim layers is unaffected until enforcement is explicitly enabled.

[Service]
ExecCondition=/usr/local/bin/workspace-exec-policy-session-gate
