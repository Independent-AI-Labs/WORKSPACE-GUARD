    reason: Remote query payloads belong under the repository SQL tree, loaded by the sanctioned loader.
  - id: exec-curl-data
    regex: '\bcurl\b[\s\S]{0,200}?(?:-d|--data)\b'
    hint: Remote-execution payloads are an unscanned code channel.
    scope: file
    mode: block
    category: remote-exec
    contexts: [file]
    mask: true
    exemptible: true
    reason: Remote-execution payloads are an unscanned code channel.
  - id: interp-substitution-inline
    regex: '(^|[[:space:];|&`(])\$\{[A-Za-z_][A-Za-z0-9_]*//[^}]*\b(bash|sh|python[0-9.]*|perl[0-9.]*|ruby[0-9.]*|node|php[0-9.]*|lua[0-9.]*|awk)\b[^}]*\}'
    hint: Textual reconstruction of an inline interpreter token is blocked.
    scope: file
    mode: block
    category: interpreter
    contexts: [file, command, script]
    mask: false
    exemptible: false
    reason: Textual reconstruction of an inline interpreter token is an unscanned code channel.
  - id: interp-inline-code
    regex: (^|([\n\x3b|&\x60]|&&|\|\||\$\()\s*|\b(sudo|doas|env|exec|nice|nohup|setsid|stdbuf|timeout|xargs)\b(\s+(-[^\x3b|&\s]*|[A-Za-z_]+=\S*))*\s+)([A-Za-z_][A-Za-z0-9_]*=\S*\s+)*([^[:space:]\x3b|&\x60]*/)?(python[0-9.]*|perl[0-9.]*|ruby[0-9.]*|irb|node|nodejs|deno|bun|php[0-9.]*|lua[0-9.]*|luajit|tclsh|wish|expect|Rscript|raku|julia|awk|gawk|mawk|nawk|bash|sh)([[:space:]]*(<<-?)|[[:space:]]+(<<-?|<|-[ce]|--(eval|execute|expr|code)|-([[:space:]]|\z|[\x3b|&\x60])))
    hint: inline interpreter code (-c/-e/stdin/heredoc) is blocked even via a path-qualified interpreter; run a committed script file instead
    scope: both
    mode: block
    category: interpreter
    contexts:
      - file
      - command
      - script
    mask: true
    exemptible: true
    reason: Inline interpreter payloads are an unscanned code channel.
allowed_constructs:
  - id: markdown-fenced-code
    language: markdown
    level: 1
    open: '^[ \t]{0,3}```'
    close: '^[ \t]{0,3}```'
    reason: A level-one fenced code block is a sanctioned construct of Markdown.
  - id: markdown-inline-code-span
    language: markdown
    level: 1
    pattern: '`[^`\n]+`'
    reason: An inline code span is the Markdown construct for naming a code token in prose.
  - id: shell-interpreter-invocation
    language: shell
    level: 1
    pattern: '(?i)\b(?:bash|sh|zsh|dash)\s+-c\b'
    reason: A shell script invoking a shell is the language carrying its own interpreter.
  - id: yaml-declared-command
    language: yaml
    level: 1
    pattern: '(?i)(?:entry|command|run|shell)\s*:[^\n]*?\b(?:bash|sh|zsh|dash)\s+-c\b'
    reason: A declared command field in YAML is the format's sanctioned place for an interpreter invocation.
  - id: sql-source-statements
    language: sql
    level: 1
    category: sql
    reason: SQL statement syntax is the sanctioned content of a SQL source file.
