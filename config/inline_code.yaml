    hint: Query text belongs under the repository SQL tree, loaded by the sanctioned loader.
    scope: file
    mode: block
    category: sql
    contexts: [file]
    mask: true
    exemptible: true
    reason: Query text belongs under the repository SQL tree, loaded by the sanctioned loader.
