  - id: exec-clickhouse-query
    regex: '\bclickhouse-client\b[\s\S]{0,200}?(?:-q|--query)\b'
    hint: Remote query payloads belong under the repository SQL tree, loaded by the sanctioned loader.
    scope: file
    mode: block
    category: remote-exec
    contexts: [file]
